name: Auto Push System

on:
  schedule:
    # Run every 2 hours between 10 AM and 10 PM UTC (7 times per day)
    - cron: '0 10,12,14,16,18,20,22 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests schedule
    
    - name: Configure Git
      run: |
        git config --global user.name "Auto Push Bot"
        git config --global user.email "auto-push@github.com"
    
    - name: Run Auto Push
      run: |
        cd ${{ github.workspace }}
        python auto_push.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

